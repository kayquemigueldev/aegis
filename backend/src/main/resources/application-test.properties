# AEGIS-033 — Integration test profile
# This profile does not create an isolated database.
# DB_URL and DB_PASSWORD must target the intended test DB.
aegis.environment.name=test
aegis.security.mode=${AEGIS_SECURITY_MODE:database}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false

logging.level.org.hibernate=WARN
