spring.application.name=aegis

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5434/aegis}
spring.datasource.username=${DB_USERNAME:aegis}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Server remains local-only during development.
server.address=127.0.0.1
server.port=8081

# Authentication mode: local or database.
aegis.security.mode=${AEGIS_SECURITY_MODE:local}

# Legacy local development credentials.
aegis.security.username=${AEGIS_API_USERNAME:}
aegis.security.password=${AEGIS_API_PASSWORD:}
aegis.security.sensors=${AEGIS_API_SENSORS:}

# Optional initial database administrator bootstrap.
aegis.bootstrap.admin.username=${AEGIS_BOOTSTRAP_ADMIN_USERNAME:}
aegis.bootstrap.admin.password=${AEGIS_BOOTSTRAP_ADMIN_PASSWORD:}