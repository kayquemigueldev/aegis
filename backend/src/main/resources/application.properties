spring.application.name=aegis

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5434/aegis}
spring.datasource.username=${DB_USERNAME:aegis}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true


# API sem autenticacao: somente acesso local durante o MVP.
server.address=127.0.0.1

# API Security - credentials supplied by environment.
aegis.security.username=${AEGIS_API_USERNAME:}
aegis.security.password=${AEGIS_API_PASSWORD:}

# Local-only HTTP interface for development.
server.address=127.0.0.1

# Comma-separated sensor IDs visible to the local API analyst.
aegis.security.sensors=${AEGIS_API_SENSORS:}

server.port=8081
